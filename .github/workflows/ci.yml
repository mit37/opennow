name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: opennow
          POSTGRES_PASSWORD: opennow
          POSTGRES_DB: opennow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opennow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://opennow:opennow@localhost:5432/opennow_test
      TEST_DATABASE_URL: postgresql://opennow:opennow@localhost:5432/opennow_test
      PHONE_HASH_SECRET: ci-test-secret
      # Fixed test-only Fernet key (not a secret) so ALERT_ENCRYPTION_KEY-dependent
      # code paths are exercised in CI without needing a repo secret.
      ALERT_ENCRYPTION_KEY: kMdchh_P26uveBNghzUa8qQ2OrBFlKA7KNSdvLF-skM=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install postgresql client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -U opennow; do sleep 1; done

      - name: Run migrations
        run: |
          for f in migrations/*.sql; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run tests
        run: pytest -q

      - name: Run ruff
        run: ruff check .
