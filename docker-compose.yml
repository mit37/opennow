services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: opennow
      POSTGRES_PASSWORD: opennow
      POSTGRES_DB: opennow
    ports:
      - "5432:5432"
    volumes:
      - opennow_db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://opennow:opennow@db:5432/opennow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
      - ./jobs:/code/jobs

volumes:
  opennow_db_data:
